# Natural ARC science questions (Section 3.2), with no gold label at any stage:
# all 2241 ARC-Easy training questions, unfiltered, targets read from the
# frozen model, a fixed budget of 768 updates and the last checkpoint.
#
#   psi-train configs/arc-gemma-2-2b.yaml --seed 11
seed: 11

subject:
  model: google/gemma-2-2b
  device: cuda
  dtype: float16

cut:
  kind: residual
  layer: 17
  position: last_token

data:
  seed: 11
  task: arc
  variable: x_order
  dataset: mib-bench/arc_easy
  subset: null
  num_choices: 4
  max_length: 256
  counterfactuals:
    - answerPosition
    - randomLetter
    - answerPosition_randomLetter
  quality_gate: 0
  correctness_filter: false  # keep every question, including those the model gets wrong
  cache_root: data/arc
  record_batch_size: 8
  batch_size: 8
  num_workers: 0
  mix_groups: true
  donor_pairing: derangement
  training_pool: base_only

psi:
  test_dim: 4
  abstraction:
    kind: linear
    carrier_rank: 16
    activation_dim: 2304
  transport: full_change
  target_kind: soft
  objective:
    mass_mode: conditional
  loss_weights:
    donor: 1.0
    nuisance: 0.0
    calibration: 0.0
    control: 0.0
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0

trainer:
  max_epochs: 1000
  max_steps: 768
  accelerator: auto
  devices: 1
  check_val_every_n_epoch: null
  val_check_interval: 100000
  num_sanity_val_steps: 0
  limit_val_batches: 0

checkpoint:
  monitor: null
  save_top_k: 1
  every_n_train_steps: 768
  save_on_train_epoch_end: false

logging:
  level: INFO
